[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "orca-visualizer"
version = "0.3.0"
description = "Cross-platform ORCA post-processing and visualization app built with Streamlit, ASE, and Plotly."
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = { text = "MIT" }
authors = [
  { name = "wuls968" }
]
keywords = ["ORCA", "quantum chemistry", "visualization", "streamlit", "ase", "plotly"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Chemistry",
]
dependencies = [
  "ase",
  "kaleido<1",
  "numpy",
  "pandas",
  "plotly",
  "psutil",
  "scikit-image",
  "streamlit",
]

[project.optional-dependencies]
dev = [
  "build",
  "ruff",
]

[project.scripts]
orca-visualizer = "orca_viz.cli:main"
orca-viz-doctor = "orca_viz.cli:doctor_main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["orca_viz*"]

[tool.setuptools.package-data]
orca_viz = ["assets/*.js"]
